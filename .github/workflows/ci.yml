name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Diagnose Tauranga rental providers
        run: node scripts/diagnose-tauranga.mjs

      - name: Verify Roomies location links
        run: node scripts/check-roomies.mjs

      - name: Build
        run: npm run build
